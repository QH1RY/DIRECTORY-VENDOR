<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quirky Hire | Supplier Directory</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#213129;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}header{background:#173e33;color:white;padding:25px 5vw}header h1{margin:0;font-size:25px}header p{opacity:.8;margin:6px 0 0}main{max-width:1200px;margin:auto;padding:28px 20px}.toolbar,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:18px}input,select,textarea,button{font:inherit;border-radius:9px;padding:11px 13px;border:1px solid #cdd9d2}input,select{max-width:100%}input[type=search]{flex:1;min-width:230px}button{background:#176d53;color:white;border:0;cursor:pointer}button.secondary{background:white;color:#176d53;border:1px solid #b7ccc2}button.danger{background:#9c3e3e}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:white;padding:20px;border:1px solid #dee8e2;border-radius:14px;box-shadow:0 2px 8px #143d290b}.card h3{margin:0 0 8px}.tag{font-size:12px;background:#e5f3ea;color:#176d53;padding:5px 9px;border-radius:20px;display:inline-block;margin:4px 0}.meta{color:#66786d;font-size:14px;overflow-wrap:anywhere}.card p{white-space:pre-wrap}.card .actions{margin-top:16px}.star{font-size:22px;color:#aa7813;background:transparent;padding:0 5px}.muted{color:#66786d}dialog{border:0;border-radius:17px;box-shadow:0 20px 100px #0004;width:min(700px,95vw);max-height:90vh}dialog::backdrop{background:#061d15a6}form .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}label.wide{grid-column:1/-1}textarea{min-height:90px}footer{padding:20px;text-align:center;color:#607268;font-size:13px}@media(max-width:600px){form .fields{grid-template-columns:1fr}label.wide{grid-column:1}}</style></head><body><header><h1>Quirky Hire · Supplier Directory</h1><p>Your trusted network for events, styling and brand activations</p></header><main><div class="toolbar"><input id="search" type="search" placeholder="Search supplier, services, location or notes…" aria-label="Search suppliers"><select id="category" aria-label="Category"><option value="">All categories</option></select><select id="view" aria-label="View"><option value="all">All suppliers</option><option value="favourites">Favourites only</option></select><button id="add">+ Add supplier</button></div><div class="toolbar"><button class="secondary" id="export">Export backup (JSON)</button><button class="secondary" id="import">Import backup</button><input hidden type="file" id="file" accept=".json,application/json"><span class="muted" id="count"></span></div><h2>Browse by category</h2><section id="categoryTiles" class="cards"></section><h2>Supplier profiles</h2><section class="cards" id="cards"></section></main><dialog id="modal"><form id="form"><h2 id="formTitle">Add supplier</h2><input type="hidden" name="id"><div class="fields"><label>Supplier / company *<input required name="name"></label><label>Contact person<input name="contact"></label><label>Category<select name="category" id="formCategory"></select></label><label>Location<input name="location"></label><label>Phone / WhatsApp<input name="phone" type="tel"></label><label>Email<input name="email" type="email"></label><label>Website<input name="website" type="url" placeholder="https://"></label><label>Lead time<input name="leadTime" placeholder="e.g. 2 working days"></label><label class="wide">Products / services<textarea name="services"></textarea></label><label class="wide">Prices / minimum order / discounts<textarea name="pricing"></textarea></label><label class="wide">Private notes / past experience<textarea name="notes"></textarea></label><label><span>Favourite</span><input type="checkbox" name="favourite"></label></div><div class="actions" style="margin-top:20px"><button type="submit">Save supplier</button><button class="secondary" type="button" id="cancel">Cancel</button></div></form></dialog><footer>Records are saved in this browser only. Export regular backups. This version does not synchronise across devices.</footer><script>
const categories=["Live Entertainment & Talent","Fabrics & Draping","Balloons & Décor","Photo Experiences","Furniture & Props","Printing & Signage","Logistics & Crew","Lighting & AV","International Sourcing","Other"];const key="quirky-hire-suppliers-v1";let records=[];try{const saved=JSON.parse(localStorage.getItem(key)||"[]");records=Array.isArray(saved)?saved:[]}catch{};if(!records.some(x=>x.id==="supplier-lizzie-reynolds-001")){records.push({"id":"supplier-lizzie-reynolds-001","name":"Lizzie Reynolds","contact":"Lizzie Reynolds","category":"Live Entertainment & Talent","location":"Near St Neots, Cambridgeshire, UK","phone":"","email":"","website":"https://www.lizziereynolds.co.uk","leadTime":"Availability and booking lead time to be confirmed","services":"Professional live vocalist; singer-songwriter; acoustic/background sets; high-impact feature performances; Adele tribute; bespoke song requests; brand activations; VIP, press and hospitality events; festivals; sporting events; creator content and digital collaborations.","pricing":"Rates and packages to be confirmed directly with artist.","notes":"INBOUND INTRODUCTION TO BXP123 (supplier prospect; not yet vetted). 10+ years professional performing experience. Self-reported 30,000+ TikTok followers; livestreams ~5 nights weekly with 10,000+ viewers passing through each LIVE. Original song 'I Won't Let You Down' reported 2.3m TikTok listens/views. Reports Superdry used her music in a TikTok video; invited by TikTok and Coca-Cola to perform at Coca-Cola Music Experience Madrid; attended Apple Music Hall opening representing TikTok; BBC Introducing support; performs for Savage Wolf Promotions boxing events. Open to learning brand-specific songs and creating social content. TikTok: https://www.tiktok.com/@lizziereynoldsvocalist ; boxing example: https://www.tiktok.com/@lizziereynoldsvocalist/video/7658826311367920898 ; music: https://lizziereynolds.co.uk/music/ ; Spotify: https://open.spotify.com/artist/3Sp5WAG2WKoCkCfhH8Mknd?si=IHXEmh2JRme0BRrmYd7UiA . Source: unsolicited introductory email. Confirm rates, availability, rider, travel and booking terms before recommending.","favourite":false});localStorage.setItem(key,JSON.stringify(records))};const $=id=>document.getElementById(id);const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const persist=()=>localStorage.setItem(key,JSON.stringify(records));const opts=categories.map(c=>'<option value="'+safe(c)+'">'+safe(c)+'</option>').join("");$("category").insertAdjacentHTML("beforeend",opts);$("formCategory").innerHTML=opts;
function render(){const selected=$("category").value;$("categoryTiles").innerHTML=categories.map(cat=>{const n=records.filter(x=>x.category===cat).length;return `<button class="secondary" data-cat="${safe(cat)}" style="min-height:100px;text-align:left;font-weight:bold">${safe(cat)}<div style="font-size:13px;margin-top:12px">${n} suppliers</div></button>`}).join("");const term=$("search").value.toLowerCase().trim(),category=$("category").value,fav=$("view").value==="favourites";const filtered=records.filter(x=>(!category||x.category===category)&&(!fav||x.favourite)&&[x.name,x.contact,x.services,x.location,x.notes,x.pricing].some(v=>String(v||"").toLowerCase().includes(term)));$("count").textContent=filtered.length+" of "+records.length+" suppliers";$("cards").innerHTML=filtered.length?filtered.map(x=>{const i=records.indexOf(x);return '<article class="card"><div class="actions" style="justify-content:space-between"><span class="tag">'+safe(x.category)+'</span><button class="star" data-act="star" data-i="'+i+'" aria-label="Toggle favourite">'+(x.favourite?'★':'☆')+'</button></div><h3>'+safe(x.name)+'</h3><p class="meta">'+safe([x.contact,x.location].filter(Boolean).join(" · "))+'</p><p>'+safe(x.services)+'</p>'+ (x.pricing?'<p><strong>Pricing:</strong> '+safe(x.pricing)+'</p>':'')+(x.leadTime?'<p><strong>Lead time:</strong> '+safe(x.leadTime)+'</p>':'')+(x.notes?'<p class="meta"><strong>Notes:</strong> '+safe(x.notes)+'</p>':'')+'<div class="meta">'+(x.phone?'<div>☎ '+safe(x.phone)+'</div>':'')+(x.email?'<div>✉ '+safe(x.email)+'</div>':'')+(x.website?'<div>Website: '+safe(x.website)+'</div>':'')+'</div><div class="actions"><button data-act="edit" data-i="'+i+'">Edit</button><button class="danger" data-act="delete" data-i="'+i+'">Delete</button></div></article>'}).join(""):'<p class="muted">No suppliers found. Select “Add supplier” to create your first profile.</p>'}
function openForm(x){$("form").reset();$("formTitle").textContent=x?"Edit supplier":"Add supplier";if(x){for(const [k,v] of Object.entries(x)){const e=$("form").elements.namedItem(k);if(e)e.type==="checkbox"?e.checked=!!v:e.value=v??""}}$("modal").showModal()}$("add").onclick=()=>openForm();$("cancel").onclick=()=>$("modal").close();$("form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x={};for(const k of ["id","name","contact","category","location","phone","email","website","leadTime","services","pricing","notes"])x[k]=String(f.get(k)||"").trim();x.favourite=e.target.elements.namedItem("favourite").checked;if(!x.id)x.id=crypto.randomUUID?crypto.randomUUID():Date.now().toString();const index=records.findIndex(r=>r.id===x.id);if(index<0)records.push(x);else records[index]=x;persist();$("modal").close();render()};$("cards").onclick=e=>{const b=e.target.closest("button[data-act]");if(!b)return;const i=Number(b.dataset.i),x=records[i];if(!x)return;if(b.dataset.act==="star")x.favourite=!x.favourite;if(b.dataset.act==="edit")return openForm(x);if(b.dataset.act==="delete"&&!confirm("Delete "+x.name+"?"))return;if(b.dataset.act==="delete")records.splice(i,1);persist();render()};["search","category","view"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));$("export").onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="quirky-hire-suppliers-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x.name==="string"))throw Error("Invalid supplier backup");if(confirm("Import "+data.length+" suppliers? Existing suppliers will be retained and matching IDs updated.")){const map=new Map(records.map(x=>[x.id,x]));data.forEach(x=>map.set(x.id||crypto.randomUUID(),x));records=[...map.values()];persist();render()}}catch(err){alert("Import failed: "+err.message)}e.target.value=""};$("categoryTiles").onclick=e=>{const b=e.target.closest("button[data-cat]");if(!b)return;$("category").value=b.dataset.cat;render()};render();
</script></body></html>
